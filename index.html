<body class="h-screen flex items-center justify-center">

<div class="w-full max-w-sm px-6">
  <div class="flex flex-col items-center mb-8">
    <div class="w-14 h-14 rounded-xl gradient-brand text-white flex items-center justify-center text-2xl shadow-xl mb-3">📬</div>
    <h1 class="text-2xl font-bold text-gradient">Gmail OTP</h1>
    <p class="text-xs text-zinc-500 mt-1">Login untuk lanjut ke dashboard</p>
  </div>

  <form id="loginForm" class="bg-[#13131a] border border-zinc-800/80 rounded-xl p-6 shadow-2xl space-y-4">
    <div>
      <label class="block text-xs font-medium text-zinc-400 mb-1.5">Username</label>
      <input id="username" type="text" autocomplete="username" required="" class="w-full px-3 py-2 text-sm bg-zinc-900 border border-zinc-800 rounded-md focus:outline-none focus:border-zinc-600 placeholder:text-zinc-600 text-zinc-100" placeholder="admin / operator">
    </div>
    <div>
      <label class="block text-xs font-medium text-zinc-400 mb-1.5">Password</label>
      <input id="password" type="password" autocomplete="current-password" required="" class="w-full px-3 py-2 text-sm bg-zinc-900 border border-zinc-800 rounded-md focus:outline-none focus:border-zinc-600 placeholder:text-zinc-600 text-zinc-100" placeholder="••••••••">
    </div>

    <div id="errorBox" hidden="" class="px-3 py-2 rounded-md bg-red-500/10 border border-red-500/30 text-red-400 text-xs"></div>

    <button type="submit" id="submitBtn" class="w-full py-2.5 rounded-md gradient-brand text-white text-sm font-semibold shadow-lg hover:opacity-90 transition disabled:opacity-50 disabled:cursor-not-allowed">
      Masuk
    </button>

    <div class="pt-2 border-t border-zinc-800/80">
      <p class="text-[11px] text-zinc-500 leading-relaxed">
        <span class="text-zinc-400 font-semibold">WARNING</span><br>
        <span class="text-zinc-300">untuk lihat OTP</span> / <span class="text-zinc-300">email masuk  aja
</span> — full access<br>
        <span class="text-zinc-300">email masuk  aja
</span> / <span class="text-zinc-300">dan Hanya lihat</span> — read-only
      </p>
    </div>
  </form>

  <p class="text-center text-[11px] text-zinc-600 mt-4">Mode read-only Gmail · OAuth scope: gmail.readonly</p>
</div>

<script>
  const form = document.getElementById("loginForm");
  const errBox = document.getElementById("errorBox");
  const btn = document.getElementById("submitBtn");

  function showError(msg) {
    errBox.textContent = msg;
    errBox.hidden = false;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errBox.hidden = true;
    btn.disabled = true;
    btn.textContent = "Memproses...";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (data.error === "invalid_credentials") showError("Username atau password salah.");
        else if (data.error === "missing_fields") showError("Username & password wajib diisi.");
        else showError(data.message || "Login gagal: " + res.status);
        return;
      }
      window.location.href = "/dashboard.html";
    } catch (err) {
      showError("Tidak bisa menghubungi server: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Silahkan";
    }
  });

  // Kalau sudah login, langsung loncat ke dashboard
  fetch("/api/me").then(r => r.ok && (window.location.href = "/dashboard.html")).catch(() => {});
</script>



</body></html>
