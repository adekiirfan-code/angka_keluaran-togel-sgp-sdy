<!DOCTYPE html>
<html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Panel · Gmail OTP Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top left, rgba(30, 64, 175, 0.18) 0%, transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        linear-gradient(180deg, #061029 0%, #050d24 100%);
      background-attachment: fixed;
      color: #e5e7eb;
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .sidebar { width: 256px; }
    .nav-group-label {
      padding: 14px 16px 6px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 700;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; margin: 1px 8px;
      border-radius: 8px;
      font-size: 13px; color: #cbd5e1;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .nav-item:hover { background: rgba(59, 130, 246, 0.08); color: #fff; }
    .nav-item.active {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(99, 102, 241, 0.15));
      color: #fff;
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 4px 12px -2px rgba(59, 130, 246, 0.25);
    }
    .nav-icon { font-size: 14px; width: 20px; text-align: center; }
    .nav-soon {
      margin-left: auto;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .stat-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.7), rgba(30, 41, 59, 0.5));
      border: 1px solid rgba(59, 130, 246, 0.15);
      border-radius: 12px;
      padding: 18px 20px;
      transition: border-color 0.2s;
    }
    .stat-card:hover { border-color: rgba(59, 130, 246, 0.4); }
    .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .stat-value { font-size: 28px; font-weight: 800; color: #fff; margin-top: 4px; line-height: 1; }
    .stat-sub { font-size: 11px; color: #94a3b8; margin-top: 6px; }
    .panel-card {
      background: rgba(10, 26, 62, 0.6);
      border: 1px solid rgba(59, 130, 246, 0.18);
      border-radius: 14px;
      padding: 22px;
    }
    .panel-card h3 {
      font-size: 14px; font-weight: 700; color: #e5e7eb;
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px;
    }
    .table-row { border-bottom: 1px solid rgba(59, 130, 246, 0.08); }
    .table-row:last-child { border-bottom: 0; }
    .status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 6px;
    }
    .status-active   { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
    .status-reconnect{ background: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.6); }
    .status-verify   { background: #f97316; }
    .status-blocked  { background: #ef4444; }
    .status-disabled { background: #52525b; }
    .coming-soon-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.5), rgba(30, 41, 59, 0.3));
      border: 1px dashed rgba(245, 158, 11, 0.4);
      border-radius: 16px;
      padding: 36px;
      text-align: center;
    }
    .badge-soon {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      background: rgba(245, 158, 11, 0.15); color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .log-line { font-family: ui-monospace, monospace; font-size: 11px; padding: 4px 8px; border-radius: 4px; }
    .log-info  { color: #cbd5e1; }
    .log-warn  { color: #fbbf24; background: rgba(245, 158, 11, 0.06); }
    .log-error { color: #fca5a5; background: rgba(239, 68, 68, 0.08); }
    .scroll-slim::-webkit-scrollbar { width: 6px; }
    .scroll-slim::-webkit-scrollbar-track { background: transparent; }
    .scroll-slim::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.25); border-radius: 4px; }
    [hidden] { display: none !important; }
  </style>
